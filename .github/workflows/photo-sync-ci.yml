name: Photo Sync CI

on:
  pull_request:
    paths:
      - apps/photo-sync/**
      - .github/workflows/photo-sync-ci.yml

concurrency:
  group: photo-sync-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build macOS app
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test --package-path apps/photo-sync

      - name: Build app
        run: ./apps/photo-sync/build.sh
