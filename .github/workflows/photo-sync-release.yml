name: Photo Sync Release

on:
  push:
    branches:
      - main
    paths:
      - apps/photo-sync/**
      - .github/workflows/photo-sync-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APP_PATH: apps/photo-sync/build/Homie Photos.app
      ARCHIVE_PATH: apps/photo-sync/build/HomiePhotos.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test --package-path apps/photo-sync

      - name: Import Developer ID certificate
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/photo-sync-signing.keychain-db
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          : "${MACOS_CERTIFICATE:?MACOS_CERTIFICATE secret is required}"
          : "${MACOS_CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD secret is required}"

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$certificate_path" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -t cert \
            -f pkcs12 \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          identities="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          printf '%s\n' "$identities"

          # find-identity exits 0 even when it finds nothing, so assert instead.
          if ! printf '%s' "$identities" | grep -q 'Developer ID Application'; then
            printf 'No Developer ID Application identity in the signing keychain\n' >&2
            exit 1
          fi

          rm -f "$certificate_path"

      - name: Build signed app
        timeout-minutes: 10
        env:
          CODESIGN_IDENTITY: "Developer ID Application: KURT SCHWARZ (P9DZH3LW75)"
        run: ./apps/photo-sync/build.sh

      - name: Create notarization archive
        run: ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE_PATH"

      - name: Notarize app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID secret is required}"
          : "${APPLE_API_ISSUER_ID:?APPLE_API_ISSUER_ID secret is required}"
          : "${APPLE_API_KEY:?APPLE_API_KEY secret is required}"

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$api_key_path"

          xcrun notarytool submit "$ARCHIVE_PATH" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          rm -f "$api_key_path"

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

          rm -f "$ARCHIVE_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE_PATH"

      - name: Upload app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: HomiePhotos-${{ github.sha }}
          path: apps/photo-sync/build/HomiePhotos.zip
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/photo-sync-signing.keychain-db
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8
