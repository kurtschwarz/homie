name: Photo Sync Release

on:
  push:
    tags:
      - photo-sync-v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CODESIGN_IDENTITY: "Developer ID Application: KURT SCHWARZ (P9DZH3LW75)"
      DMG_PATH: apps/photo-sync/build/HomiePhotos.dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#photo-sync-v}"
          printf 'Version: %s\n' "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test --package-path apps/photo-sync

      - name: Import Developer ID certificate
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/photo-sync-signing.keychain-db
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          : "${MACOS_CERTIFICATE:?MACOS_CERTIFICATE secret is required}"
          : "${MACOS_CERTIFICATE_PASSWORD:?MACOS_CERTIFICATE_PASSWORD secret is required}"

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$certificate_path" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -t cert \
            -f pkcs12 \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          identities="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          printf '%s\n' "$identities"

          # find-identity exits 0 even when it finds nothing, so assert instead.
          if ! printf '%s' "$identities" | grep -q 'Developer ID Application'; then
            printf 'No Developer ID Application identity in the signing keychain\n' >&2
            exit 1
          fi

          rm -f "$certificate_path"

      - name: Build signed app
        timeout-minutes: 10
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./apps/photo-sync/build.sh

      - name: Package DMG
        timeout-minutes: 10
        run: ./apps/photo-sync/package.sh

      - name: Notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          : "${APPLE_API_KEY_ID:?APPLE_API_KEY_ID secret is required}"
          : "${APPLE_API_ISSUER_ID:?APPLE_API_ISSUER_ID secret is required}"
          : "${APPLE_API_KEY:?APPLE_API_KEY secret is required}"

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" | base64 --decode > "$api_key_path"

          xcrun notarytool submit "$DMG_PATH" \
            --key "$api_key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          rm -f "$api_key_path"

      - name: Staple notarization ticket
        run: |
          # Stapling fetches the ticket from Apple's CloudKit, which drops connections intermittently.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$DMG_PATH" && xcrun stapler validate "$DMG_PATH"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Stapling failed after $attempt attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done

          # A disk image is assessed as "open", not "execute".
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=2 \
            "$DMG_PATH"

      - name: Upload DMG
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: HomiePhotos-${{ github.sha }}
          path: apps/photo-sync/build/HomiePhotos.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/photo-sync-signing.keychain-db
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only this job gets a write token, so it never holds the signing secrets.
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download DMG
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: HomiePhotos-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/HomiePhotos.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --latest=false
