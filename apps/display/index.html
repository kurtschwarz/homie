<!doctype html>
<!-- data-surface is set here as well as by HomieThemeProvider: the provider
     applies it in an effect, so without this the first paint would lay out at
     the unscaled desktop root font-size and then snap. -->
<html lang="en" data-surface="kiosk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Homie</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
