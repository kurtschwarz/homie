services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile.dev
    ports:
      - "3030:3000"
    environment:
      HOMIE_ADDR: ":3000"
      HOMIE_PLAYGROUND: "1"
      HOMIE_DB_PATH: "/var/lib/homie/homie.db"
      HOMIE_RIVER_DB_PATH: "/var/lib/homie/river.db"
      HOMIE_PHOTOS_PATH: "/var/lib/homie/photos"
      HOMIE_AUTH_TOKEN_PATH: "/run/homie-token/token"
      TZ: "${TZ:-UTC}"
    env_file:
      - path: ./services/api/.env
        required: false
    volumes:
      - ./services/api:/src
      - api-data:/var/lib/homie
      - api-token:/run/homie-token
      - ./.scratch/weatherkit.p8:/run/secrets/weatherkit.p8:ro
      - ./.scratch/photos:/var/lib/homie/photos
      - api-gomod-cache:/go/pkg/mod

  display:
    image: node:22-bookworm
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @homie/display dev -- --host"
    ports:
      - "5173:5173"
    environment:
      HOMIE_API_URL: "http://api:3000"
      HOMIE_AUTH_TOKEN_PATH: "/run/homie-token/token"
    volumes:
      - .:/app
      - display-node-modules:/app/node_modules
      - api-token:/run/homie-token:ro
    depends_on:
      - api

  manager:
    image: node:22-bookworm
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @homie/manager dev -- --host"
    ports:
      - "5174:5174"
    environment:
      HOMIE_API_URL: "http://api:3000"
    volumes:
      - .:/app
      - manager-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  api-data:
  api-token:
  api-gomod-cache:
  display-node-modules:
  manager-node-modules:
