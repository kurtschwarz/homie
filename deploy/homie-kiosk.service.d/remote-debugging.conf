; Dev-only override: exposes Chromium's DevTools protocol so a Mac can
; attach full Chrome DevTools over an SSH tunnel. Not applied by default —
; install manually with:
;   ssh homie 'sudo mkdir -p /etc/systemd/system/homie-kiosk.service.d'
;   scp services/api/deploy/homie-kiosk.service.d/remote-debugging.conf \
;     homie:/tmp/ && ssh homie 'sudo mv /tmp/remote-debugging.conf \
;     /etc/systemd/system/homie-kiosk.service.d/ && sudo systemctl restart homie-kiosk'
; Remove the same way to ship clean.
[Service]
Environment=HOMIE_KIOSK_EXTRA_FLAGS=--remote-debugging-port=9222 --remote-debugging-address=127.0.0.1
